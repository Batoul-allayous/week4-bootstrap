<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Photography Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Nature Photography Gallery</h1>
        <p>
            Explore the beauty of nature through photographs of forests,
            mountains, oceans, and wildlife. Each image captures a special
            moment in the natural world and reminds us why protecting our
            environment matters.
        </p>
    </header>

    <main class="gallery">
        <figure>
            <img src="images/forest.jpg" alt="Tall green trees in a peaceful forest">
            <figcaption>Peaceful Forest</figcaption>
        </figure>

        <figure>
            <img src="images/mountains.jpg" alt="Mountain peaks rising above the clouds">
            <figcaption>Mountain Peaks</figcaption>
        </figure>

        <figure>
            <img src="images/ocean.jpg" alt="Blue ocean waves reaching a sandy beach">
            <figcaption>Blue Ocean</figcaption>
        </figure>

        <figure>
            <img src="images/waterfall.jpg" alt="Waterfall flowing over rocks surrounded by greenery">
            <figcaption>Hidden Waterfall</figcaption>
        </figure>

        <figure>
            <img src="images/flowers.jpg" alt="Colorful wildflowers growing in a meadow">
            <figcaption>Wildflower Meadow</figcaption>
        </figure>

        <figure>
            <img src="images/sunset.jpg" alt="Golden sunset over a calm lake">
            <figcaption>Golden Sunset</figcaption>
        </figure>
    </main>
</body>

</html>
